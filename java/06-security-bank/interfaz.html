<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Banco</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5f8;
            color: #1f2937;
        }

        header {
            padding: 24px;
            background: #0f766e;
            color: white;
        }

        main {
            padding: 24px;
        }

        .usuarios {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .tarjeta {
            flex: 1 1 240px;
            padding: 18px;
            border: 1px solid #d6dce5;
            border-radius: 8px;
            background: white;
        }

        .tarjeta h2 {
            margin: 0 0 12px;
            font-size: 20px;
        }

        .dato {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #edf0f4;
        }

        .estado {
            margin-top: 12px;
            padding: 8px;
            border-radius: 6px;
            background: #dcfce7;
            color: #166534;
            text-align: center;
            font-weight: bold;
        }

        .bloqueado {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>
<body>
    <header>
        <h1>Sistema Banco Seguro</h1>
        <p>Usuarios, limites de retiro, bloqueo y movimientos.</p>
    </header>

    <main>
        <section class="usuarios">
            <article class="tarjeta">
                <h2>Daniel</h2>
                <div class="dato"><span>Rol</span><strong>ADMIN</strong></div>
                <div class="dato"><span>Saldo</span><strong>$8500</strong></div>
                <div class="dato"><span>Limite</span><strong>$2000</strong></div>
                <div class="estado">Activo</div>
            </article>

            <article class="tarjeta">
                <h2>Carlos</h2>
                <div class="dato"><span>Rol</span><strong>CLIENTE</strong></div>
                <div class="dato"><span>Saldo</span><strong>$4500</strong></div>
                <div class="dato"><span>Limite</span><strong>$1500</strong></div>
                <div class="estado">Activo</div>
            </article>

            <article class="tarjeta">
                <h2>VIO</h2>
                <div class="dato"><span>Rol</span><strong>CLIENTE</strong></div>
                <div class="dato"><span>Saldo</span><strong>$5000</strong></div>
                <div class="dato"><span>Limite</span><strong>$1000</strong></div>
                <div class="estado bloqueado">Bloqueado</div>
            </article>
        </section>
    </main>
</body>
</html>

<!--
EXPLICACION PARA PRINCIPIANTES - interfaz.html

Esta hoja es la parte visual del ejercicio. No ejecuta el codigo Java; solo muestra
una pantalla sencilla parecida al resultado del sistema bancario.

Que hace esta pagina:
- Muestra un encabezado con el nombre "Sistema Banco Seguro".
- Muestra tres tarjetas: Daniel, Carlos y VIO.
- En cada tarjeta aparecen rol, saldo, limite de retiro y estado.
- Usa CSS para dar colores, espacios y bordes.
- Usa flexbox en la clase .usuarios con display: flex.

Que es flexbox aqui:
- display: flex coloca las tarjetas una al lado de la otra.
- gap separa las tarjetas.
- flex-wrap permite que las tarjetas bajen a otra linea si la pantalla es pequena.
- flex: 1 1 240px hace que cada tarjeta tenga un ancho flexible.

Con que archivos se relaciona:
- Representa visualmente los mismos usuarios creados en App.java.
- Los datos vienen del mismo ejemplo que trabaja con usuario.java,
  SistemaLogin.java y SistemaBanco.java.

Idea principal:
interfaz.html sirve para cumplir la parte visual o de interfaz sencilla. El programa
real de Java sigue funcionando desde App.java.
-->
